[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness2-morphd"
version = "0.5.0"
description = "harness2-morphd: local-first agent harness improvement for dsh, Codex and Claude Code"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    "PyYAML>=6",
    "jsonschema>=4",
    "zstandard>=0.22",
    "cryptography>=42",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
tray = ["pystray>=0.19", "Pillow>=10"]
build = ["build>=1.2", "pyinstaller>=6.10"]

[project.scripts]
morphd = "morphd.cli.main:main"

[tool.setuptools.packages.find]
include = ["morphd*"]

[tool.setuptools.package-data]
morphd = [
    "pricing.yaml",
    "schemas/*.json",
    "templates/*",
    "base_harnesses/**/*",
    "consumer/webui/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: requires a real runtime CLI"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
